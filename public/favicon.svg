  <path d="M 10 50 C 30 20, 70 20, 90 50 C 70 80, 30 80, 10 50 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  <!-- Outer Iris/Lens ring -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Aperture blades (simplified intersection) -->
  <path d="M 40 40 L 60 40 M 60 40 L 50 60 M 50 60 L 40 40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Pupil -->
